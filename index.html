<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChengqiShi</title>
    <script src="./src/theme.js?v=20261109"></script>
    <link rel="icon" href="./assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <meta
      name="description"
      content="Academic homepage template for research profiles, publications, news, and honors."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles.css?v=20261109" />
  </head>
  <body>
    <div class="theme-control rubber-segment" id="theme-segment" role="radiogroup" aria-label="Color theme / 外观模式" data-draggable>
      <button type="button" class="rubber-segment__item" role="radio" data-value="system" aria-label="System · 跟随系统" aria-checked="true" tabindex="0">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span>系统</span>
      </button>
      <button type="button" class="rubber-segment__item" role="radio" data-value="light" aria-label="Light · 浅色" aria-checked="false" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>浅色</span>
      </button>
      <button type="button" class="rubber-segment__item" role="radio" data-value="dark" aria-label="Dark · 深色" aria-checked="false" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 14A9 9 0 0 1 10 3.2 9 9 0 1 0 20.8 14Z"/></svg><span>深色</span>
      </button>
      <div class="rubber-segment__thumb" aria-hidden="true"></div>
    </div>
    <section class="flow-intro" id="intro" aria-label="Welcome">
      <div class="flow-intro-stage">
        <canvas id="flow-canvas" aria-hidden="true"></canvas>
        <div class="intro-copy">
          <div class="intro-identity">
            <h1 class="intro-name">ChengqiShi</h1>
            <p class="intro-chinese" lang="zh-CN">石澄錡</p>
          </div>
          <nav class="intro-contacts" id="intro-contacts" aria-label="Contact and profiles"></nav>
        </div>
        <a class="intro-enter" href="#content" aria-label="Enter homepage">
          <span class="intro-arrow" aria-hidden="true">↓</span>
        </a>
        <button class="flow-toggle" type="button" aria-label="Pause background animation" aria-pressed="false" title="Pause animation" hidden>
          <span aria-hidden="true">Ⅱ</span>
        </button>
      </div>
    </section>
    <div class="page-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content" id="content" tabindex="-1"></main>
    </div>

    <script src="./data.js"></script>
    <script src="./script.js"></script>
    <script type="module" src="./src/theme-control.js?v=20261109"></script>
    <script type="module" src="./src/flow/banner.js?v=20261109"></script>
  </body>
</html>
